server:
  port: 8082
  
spring:
  application:
    name: ecom-inventory-service

  datasource:
    url: ${DB_URL:jdbc:h2:mem:inventorydb}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:password}
  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
eureka:
 client:
   register-with-eureka: true
   fetch-registry: true